# Example target settings for read-only inspection.
# Do not commit real hosts, credentials, internal paths, or private infrastructure details.
# Authentication material is intentionally excluded from this repository.
# Planned SSH usage should prefer a local SSH key on the operator machine, not passwords.
# If your local SSH config already defines HostName/User/Port/IdentityFile, you can
# point ssh_host at that alias and omit the other SSH fields in your real local file.

[target]
mode = "ssh" # local | ssh
nginx_conf_path = "/etc/nginx/nginx.conf"

[target.ssh]
host = "your-ssh-alias"
port = 22
user = "deploy"
# key_path = "~/.ssh/id_nginx_master6000"

[web]
host = "127.0.0.1"
port = 8420
base_url = "https://nginx.example.com"
session_secret_env = "NGINX_VPS_WEB_SESSION_SECRET"
trusted_proxy_ips = ["127.0.0.1", "::1"]
challenge_ttl_seconds = 120
challenge_rate_limit = 5
challenge_rate_window_seconds = 600
verify_rate_limit = 8
verify_rate_window_seconds = 600
lockout_threshold = 5
lockout_seconds = 900
session_ttl_seconds = 28800

[[web.users]]
username = "operator"
public_keys = [
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIreplaceThisWithYourPublicKey operator@laptop",
]
