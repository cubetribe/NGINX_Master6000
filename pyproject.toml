[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nginx_vps"
version = "0.1.0"
description = "Open-source Nginx and VPS diagnostics focused on visibility, safety, and explainable operations."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Dennis Westermann" }
]
keywords = ["nginx", "vps", "cli", "diagnostics", "ops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12,<1.0",
]

[project.urls]
Homepage = "https://github.com/cubetribe/NGINX_Master6000"
Repository = "https://github.com/cubetribe/NGINX_Master6000"
Issues = "https://github.com/cubetribe/NGINX_Master6000/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
nginx-vps = "nginx_vps.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nginx_vps"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
